<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>E: Stats</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,700;1,700&display=swap">
<style>
body{margin:0}
a{color:#E8F1F8}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="min-height: 1040px; background: #0B1220; color: #E8F1F8; font-family: 'Chakra Petch', sans-serif; box-sizing: border-box; overflow: hidden">
<div style="max-width: 1280px; margin: 0 auto; padding: 48px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 48px">

<nav aria-label="Main menu" style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 64px; font-weight: 700; font-style: italic; letter-spacing: 2px; line-height: 1; margin-bottom: 28px">PILA<span style="color: {{accent}}">.</span></div>
<a href="#" style="display: block; transform: skewX(-10deg); background: #16233A; padding: 14px 26px; text-decoration: none; font-size: 22px; font-weight: 700; letter-spacing: 2px"><span style="display: inline-block; transform: skewX(10deg)">01 HOME</span></a>
<a href="#" style="display: block; transform: skewX(-10deg); background: #16233A; padding: 14px 26px; text-decoration: none; font-size: 22px; font-weight: 700; letter-spacing: 2px; margin-left: 18px"><span style="display: inline-block; transform: skewX(10deg)">02 DISCOVER</span></a>
<a href="#" style="display: block; transform: skewX(-10deg); background: #16233A; padding: 14px 26px; text-decoration: none; font-size: 22px; font-weight: 700; letter-spacing: 2px; margin-left: 36px"><span style="display: inline-block; transform: skewX(10deg)">03 MY LIST</span></a>
<a href="#" style="display: block; transform: skewX(-10deg); background: {{accent}}; color: #06131A; padding: 14px 26px; text-decoration: none; font-size: 22px; font-weight: 700; letter-spacing: 2px; margin-left: 54px"><span style="display: inline-block; transform: skewX(10deg)">04 STATS</span></a>
<div style="margin-top: 28px; margin-left: 54px; transform: skewX(-10deg); border: 2px solid #3A4C6B; padding: 4px 16px">
<input type="search" aria-label="Search anime" placeholder="SEARCH..." style="transform: skewX(10deg); width: 100%; min-height: 44px; background: transparent; border: 0; outline: 0; color: #E8F1F8; font-family: inherit; font-size: 18px; letter-spacing: 2px; box-sizing: border-box">
</div>
</nav>

<main style="flex: 3 1 560px; display: flex; flex-direction: column; gap: 28px">
<h1 style="margin: 0; font-size: 60px; line-height: 1; font-weight: 700; font-style: italic; letter-spacing: 2px">STATS</h1>

<section aria-label="Totals" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px">
<div style="padding: 20px 24px 26px; background: #16233A; clip-path: polygon(0 0, 100% 0, 100% 76%, calc(100% - 24px) 100%, 0 100%)">
<div style="font-size: 13px; font-weight: 700; letter-spacing: 2px; color: #A9BDD1">ANIME IN LIST</div>
<div style="font-size: 60px; line-height: 1.1; font-weight: 700; font-style: italic">14</div>
</div>
<div style="padding: 20px 24px 26px; background: #16233A; clip-path: polygon(0 0, 100% 0, 100% 76%, calc(100% - 24px) 100%, 0 100%)">
<div style="font-size: 13px; font-weight: 700; letter-spacing: 2px; color: #A9BDD1">EPISODES WATCHED</div>
<div style="font-size: 60px; line-height: 1.1; font-weight: 700; font-style: italic; color: {{accent}}">213</div>
</div>
<div style="padding: 20px 24px 26px; background: #16233A; clip-path: polygon(0 0, 100% 0, 100% 76%, calc(100% - 24px) 100%, 0 100%)">
<div style="font-size: 13px; font-weight: 700; letter-spacing: 2px; color: #A9BDD1">COMPLETED</div>
<div style="font-size: 60px; line-height: 1.1; font-weight: 700; font-style: italic">5</div>
</div>
<div style="padding: 20px 24px 26px; background: #16233A; clip-path: polygon(0 0, 100% 0, 100% 76%, calc(100% - 24px) 100%, 0 100%)">
<div style="font-size: 13px; font-weight: 700; letter-spacing: 2px; color: #A9BDD1">MEAN SCORE</div>
<div style="font-size: 60px; line-height: 1.1; font-weight: 700; font-style: italic">8.3</div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 16px">
<h2 style="margin: 0; font-size: 20px; letter-spacing: 4px; font-weight: 700; color: #A9BDD1">BY STATUS</h2>
<div role="img" aria-label="Watching 6, Completed 5, Plan to Watch 2, Dropped 1" style="display: flex; gap: 6px; padding: 0 8px">
<div style="flex: 6; height: 30px; background: {{accent}}; transform: skewX(-20deg)"></div>
<div style="flex: 5; height: 30px; background: #E8F1F8; transform: skewX(-20deg)"></div>
<div style="flex: 2; height: 30px; background: #6C86A8; transform: skewX(-20deg)"></div>
<div style="flex: 1; height: 30px; background: #2A3B58; transform: skewX(-20deg)"></div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px 32px; font-size: 16px; font-weight: 500">
<div style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="width: 14px; height: 14px; background: {{accent}}"></span>Watching <strong style="font-size: 20px">6</strong></div>
<div style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="width: 14px; height: 14px; background: #E8F1F8"></span>Completed <strong style="font-size: 20px">5</strong></div>
<div style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="width: 14px; height: 14px; background: #6C86A8"></span>Plan to Watch <strong style="font-size: 20px">2</strong></div>
<div style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="width: 14px; height: 14px; background: #2A3B58; border: 1px solid #6C86A8"></span>Dropped <strong style="font-size: 20px">1</strong></div>
</div>
</section>

<section style="display: flex; flex-wrap: wrap; gap: 20px">

<div style="flex: 3 1 340px; padding: 26px 28px 32px; background: #16233A; clip-path: polygon(0 0, 100% 0, 100% 88%, calc(100% - 28px) 100%, 0 100%); display: flex; flex-direction: column; gap: 18px">
<h2 style="margin: 0; font-size: 20px; letter-spacing: 4px; font-weight: 700; color: #A9BDD1">TOP GENRES</h2>
<div style="display: grid; grid-template-columns: 110px 1fr 28px; align-items: center; gap: 14px 14px; font-size: 16px; font-weight: 500">
<div>Fantasy</div><div style="height: 14px; background: #2A3B58; transform: skewX(-20deg)"><div style="width: 100%; height: 14px; background: {{accent}}"></div></div><div style="font-weight: 700; font-size: 20px">6</div>
<div>Action</div><div style="height: 14px; background: #2A3B58; transform: skewX(-20deg)"><div style="width: 83%; height: 14px; background: {{accent}}"></div></div><div style="font-weight: 700; font-size: 20px">5</div>
<div>Comedy</div><div style="height: 14px; background: #2A3B58; transform: skewX(-20deg)"><div style="width: 67%; height: 14px; background: {{accent}}"></div></div><div style="font-weight: 700; font-size: 20px">4</div>
<div>Drama</div><div style="height: 14px; background: #2A3B58; transform: skewX(-20deg)"><div style="width: 50%; height: 14px; background: {{accent}}"></div></div><div style="font-weight: 700; font-size: 20px">3</div>
<div>Slice of Life</div><div style="height: 14px; background: #2A3B58; transform: skewX(-20deg)"><div style="width: 33%; height: 14px; background: {{accent}}"></div></div><div style="font-weight: 700; font-size: 20px">2</div>
</div>
</div>

<div style="flex: 2 1 260px; padding: 26px 28px 32px; background: #16233A; clip-path: polygon(0 0, 100% 0, 100% 88%, calc(100% - 28px) 100%, 0 100%); display: flex; flex-direction: column; gap: 18px">
<h2 style="margin: 0; font-size: 20px; letter-spacing: 4px; font-weight: 700; color: #A9BDD1">MY SCORES</h2>
<div role="img" aria-label="Scores given: one 6, one 7, two 8s, three 9s, one 10" style="display: flex; align-items: flex-end; gap: 12px; height: 170px">
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end"><div style="font-weight: 700">1</div><div style="width: 100%; height: 33%; background: #E8F1F8"></div></div>
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end"><div style="font-weight: 700">1</div><div style="width: 100%; height: 33%; background: #E8F1F8"></div></div>
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end"><div style="font-weight: 700">2</div><div style="width: 100%; height: 60%; background: #E8F1F8"></div></div>
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end"><div style="font-weight: 700">3</div><div style="width: 100%; height: 86%; background: {{accent}}"></div></div>
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; height: 100%; justify-content: flex-end"><div style="font-weight: 700">1</div><div style="width: 100%; height: 33%; background: #E8F1F8"></div></div>
</div>
<div aria-hidden="true" style="display: flex; gap: 12px; font-size: 14px; font-weight: 700; letter-spacing: 1px; color: #A9BDD1; text-align: center">
<div style="flex: 1">6</div><div style="flex: 1">7</div><div style="flex: 1">8</div><div style="flex: 1">9</div><div style="flex: 1">10</div>
</div>
</div>

</section>
</main>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3DF2E0"},"$preview":{"width":1280,"height":1040}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#3DF2E0' };
}
}
</script>
</body>
</html>
